<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NAZÉRA — Her Style. Her Choice. Her Story.</title>
<meta name="description" content="NAZÉRA: women aur family ke liye chune hue stylish, kifayati products. Fashion, Jewellery, Beauty, Kitchen, Kids.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Noto+Sans+Devanagari:wght@400;600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf6ee;--ink:#1c1416;--wine:#8e1246;--rose:#e9b7c4;--sand:#efe2d0;--gold:#c79a3b;--mut:#6b5b5f}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.55 Inter,'Noto Sans Devanagari',sans-serif;overflow-x:hidden}
h1,h2,h3,.serif{font-family:'Playfair Display','Noto Sans Devanagari',serif}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.wrap{max-width:1100px;margin:auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:3px double var(--ink);padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:8px;padding:8px 0}
.lgo{position:relative;flex:none}.lgo img{width:48px;height:48px;border-radius:50%;display:block}
.lgo:after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--gold);animation:ring 2.6s infinite}
@keyframes ring{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.28);opacity:0}}
.top form{flex:1;min-width:0}.top input{width:100%;padding:8px 12px;border:1px solid var(--ink);background:#fff;border-radius:20px}
.ib{background:none;border:1px solid var(--ink);border-radius:20px;padding:6px 10px;cursor:pointer;flex:none;transition:.2s}.ib:hover{background:var(--wine);color:#fff}
nav{display:flex;gap:18px;overflow-x:auto;padding:6px 0 8px;border-top:1px solid var(--ink);font-weight:600;white-space:nowrap;scrollbar-width:none}
nav a{position:relative}nav a:after{content:"";position:absolute;left:0;bottom:-2px;height:2px;width:0;background:var(--wine);transition:.25s}nav a:hover:after{width:100%}
.tick{background:var(--wine);color:#fff;overflow:hidden;white-space:nowrap;font-size:13px;padding:5px 0}
.tick span{display:inline-block;padding-left:100%;animation:tk 28s linear infinite}
@keyframes tk{to{transform:translateX(-100%)}}
.mast{text-align:center;padding:18px 0 8px;border-bottom:1px solid var(--ink)}
.mast h1{font-size:clamp(40px,10vw,84px);letter-spacing:.06em;line-height:1;background:linear-gradient(100deg,var(--wine) 40%,var(--gold) 50%,var(--wine) 60%) 0/250%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s infinite}
@keyframes sh{to{background-position:-150%}}
.mast p{color:var(--mut);margin-top:4px}
.hero{padding:22px 0 8px}.hero h2{font-size:clamp(26px,6vw,48px);line-height:1.12;margin:10px 0 14px}
.btn{position:relative;overflow:hidden;display:inline-block;background:var(--wine);color:#fff;padding:10px 18px;font-weight:600;border-radius:2px;border:0;cursor:pointer;text-align:center;transition:.2s}
.btn:after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:#fff5;transform:skewX(-20deg);animation:sw 3.2s infinite}
@keyframes sw{60%,100%{left:130%}}.btn:hover{background:var(--ink)}
.chip{display:inline-block;border:1px solid var(--ink);padding:5px 14px;border-radius:20px;background:#fff}
.sl{position:relative;margin-top:16px;overflow:hidden;border:1px solid var(--ink);aspect-ratio:16/8;background:var(--sand);touch-action:pan-y}
@media(max-width:700px){.sl{aspect-ratio:4/3}}
.sl .s{position:absolute;inset:0;background:linear-gradient(120deg,var(--wine),#d6608a) center/cover;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 18px 34px;opacity:0;transition:opacity .7s;pointer-events:none}
.sl .s.on{opacity:1;pointer-events:auto}.sl .s h3{font-size:clamp(20px,5vw,38px);text-shadow:0 2px 8px #0008}.sl .s p{text-shadow:0 1px 6px #0008}
.sl .s .btn{align-self:flex-start;margin-top:8px;background:#fff;color:var(--wine)}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:#fff8;cursor:pointer}.dots i.on{background:#fff;width:22px;border-radius:5px;transition:.3s}
.ar{position:absolute;top:50%;transform:translateY(-50%);background:#fffb;border:0;width:34px;height:34px;border-radius:50%;cursor:pointer;z-index:2}
.sec{border-top:3px double var(--ink);margin-top:28px;padding-top:10px}
.sec h2{font-size:26px}.more{float:right;color:var(--wine);font-weight:600;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;background:#fff;border:1px solid var(--ink);padding:8px;display:flex;flex-direction:column;gap:6px;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-5px);box-shadow:6px 6px 0 var(--rose)}
.im{display:block;aspect-ratio:4/5;background:linear-gradient(135deg,var(--rose),var(--sand)) center/cover;overflow:hidden}
.card .im{transition:background-size .4s}.card:hover .im{background-size:112%}
.imw{position:relative}.bd{position:absolute;bottom:8px;left:0;background:var(--wine);color:#fff;font-size:12px;padding:2px 8px}
.hb{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:#fffc;font-size:18px;cursor:pointer;color:var(--mut);transition:.2s}
.hb.on{color:var(--wine);animation:pop .4s}@keyframes pop{50%{transform:scale(1.35)}}
.card h3{font-size:15px;line-height:1.3;flex:1}
.pr{font-weight:600}.pr s{color:var(--mut);font-weight:400}.pr em{color:var(--wine);font-style:normal;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chips a:hover{background:var(--wine);color:#fff}
.pd{display:grid;gap:20px;padding:20px 0}@media(min-width:760px){.pd{grid-template-columns:1fr 1fr}}
.pd .main{aspect-ratio:1;background:linear-gradient(135deg,var(--rose),var(--sand)) center/cover;border:1px solid var(--ink)}
.th{display:flex;gap:8px;margin-top:8px;overflow-x:auto}.th div{flex:none;width:62px;height:62px;background:var(--sand) center/cover;border:2px solid transparent;cursor:pointer}.th div.on{border-color:var(--wine)}
.lbl{font-weight:600;margin:14px 0 6px}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw button{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--ink);cursor:pointer}.sw button.on{box-shadow:0 0 0 3px var(--wine)}
.sz{display:flex;gap:8px;flex-wrap:wrap}.sz button{min-width:44px;padding:6px 10px;border:1px solid var(--ink);background:#fff;cursor:pointer}.sz button.on{background:var(--ink);color:#fff}
.why{background:var(--sand);border-left:4px solid var(--wine);padding:10px 14px;margin:12px 0}
.pd ul{padding-left:18px}.spec{display:grid;grid-template-columns:1fr 2fr;gap:4px 10px;font-size:14px}.spec b{color:var(--mut);font-weight:600}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--ink);z-index:6}.sticky .btn{display:block}
footer{margin-top:40px;border-top:3px double var(--ink);padding:20px 0 90px;color:var(--mut);font-size:14px}
.fd{display:flex;align-items:center;gap:10px;margin:10px 0}.fd .av{width:44px;height:44px;border-radius:50%;background:var(--wine) center/cover;color:#fff;display:grid;place-items:center;font-weight:800;border:2px solid var(--gold)}
.frm{display:grid;gap:10px;max-width:520px;margin-top:12px}.frm input,.frm textarea{padding:9px;border:1px solid var(--ink);background:#fff}
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*,*:after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

#sg{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--ink);z-index:9;box-shadow:0 8px 20px #0003}
#sg a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--sand)}#sg a:hover{background:var(--sand)}
#sg i{width:38px;height:38px;flex:none;background:var(--sand) center/cover}#sg small{display:block;color:var(--mut)}
.off{position:absolute;top:8px;left:8px;width:46px;height:46px;border-radius:50%;background:var(--wine);color:#fff;border:2px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;line-height:1.05;font-weight:700;z-index:2;animation:pl 2s infinite}
.off b{font-size:14px}@keyframes pl{50%{transform:scale(1.1) rotate(-6deg)}}
.pr .np{font-size:18px;color:var(--wine)}.pr s{font-size:13px}
.mw{position:relative}.mw .off{width:64px;height:64px;font-size:11px;top:12px;left:12px}.mw .off b{font-size:20px}
.pp2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:8px 0}.pp2 s{color:var(--mut);font-size:18px}.pp2 .big{font-size:36px;font-weight:800;color:var(--wine);font-family:'Playfair Display',serif}.pp2 em{color:var(--ok,#1d7a4a);font-style:normal;font-weight:600}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.cc{display:flex;flex-direction:column;gap:2px;background:#fff;border:1px solid var(--ink);padding:14px;transition:.25s}.cc:hover{transform:translateY(-4px);box-shadow:5px 5px 0 var(--rose)}.cc span{font-size:28px}.cc small{color:var(--mut);word-break:break-all}
.fab{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--wine);color:#fff;display:grid;place-items:center;font-size:26px;z-index:7;box-shadow:0 6px 18px #0005;animation:wg 4s infinite}
.fab:before,.fab:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--wine);animation:rp 2.2s infinite}.fab:after{animation-delay:1.1s}
.fab small{position:absolute;right:66px;background:var(--ink);color:#fff;font-size:12px;padding:3px 9px;border-radius:12px;white-space:nowrap;animation:tp 4s infinite}
body.pp .fab{bottom:calc(84px + env(safe-area-inset-bottom))}
@keyframes rp{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.7);opacity:0}}@keyframes wg{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-14deg)}94%{transform:rotate(14deg)}97%{transform:rotate(-8deg)}}@keyframes tp{0%,60%{opacity:1}75%,100%{opacity:0}}
.mw .ar{z-index:3}
</style></head><body>
